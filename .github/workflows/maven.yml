name: Java CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout full repo + submodules with history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # disable shallow clone for main repo
          fetch-tags: true # include tags for Sonar + versioning

      # Ensure submodules are not shallow
      - name: Unshallow submodules
        run: git submodule foreach 'git fetch --unshallow || true'

      # Setup Java + Maven cache
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # SonarQube Cloud Free supports main-branch analysis and PR analysis targeting main.
      # Keep Sonar enabled for master pushes and trusted same-repository PRs to master.
      - name: Build & Test with SonarCloud
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          xvfb-run mvn \
            -Declipse.p2.mirrors=false \
            verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      # Feature-branch pushes, tag pushes, and fork PRs still execute the full build and test suite.
      - name: Build & Test (without SonarCloud)
        if: (github.event_name == 'push' && github.ref != 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          xvfb-run mvn \
            -Declipse.p2.mirrors=false \
            verify

      # Pre-release on master branch
      - name: Publish Pre-Release
        if: github.ref == 'refs/heads/master'
        uses: crowbarmaster/GH-Automatic-Releases@v1.6.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: Development Build
          files: |
            build/org.gravity.updatesite/target/site.zip
            build/org.gravity.headless.product/target/products/*.zip

      # Release on tag push
      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: crowbarmaster/GH-Automatic-Releases@v1.6.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            build/org.gravity.updatesite/target/site.zip
            build/org.gravity.headless.product/target/products/*.zip
